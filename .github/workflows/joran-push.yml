name: Joran Push

on:
  # Hauptzeitgeber: der Cloudflare Worker (proxy/worker.js) stösst alle 10 Minuten workflow_dispatch mit test=false an.
  # Der GitHub-Zeitplan bleibt als Rückfall; GitHub startet ihn in der Praxis oft nur alle paar Stunden.
  schedule:
    - cron: "7,37 4-19 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Nur Testnachricht senden"
        type: boolean
        default: true
      user:
        description: "Test nur an diesen Nutzer (leer = alle)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: joran-push
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Messreihe Seestationen holen
        # Teilabruf: Dateiinhalte (Archiv) erst bei Bedarf, damit der wachsende Ordner archive den Lauf nicht verlangsamt
        run: |
          { git fetch -q --filter=blob:none origin +refs/heads/live:refs/remotes/origin/live || git fetch -q origin +refs/heads/live:refs/remotes/origin/live; } \
            && git show origin/live:lake.json > "$RUNNER_TEMP/lake.json" || echo "noch keine Messreihe"
      - name: Wind prüfen
        run: node push/check.cjs
        env:
          NTFY_TOPICS: ${{ secrets.NTFY_TOPICS }}
          JORAN_TEST: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.test) == 'true' && '1' || '0' }}
          JORAN_USER: ${{ inputs.user }}
          JORAN_LAKE: ${{ runner.temp }}/lake.json
          JORAN_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Zustand sichern
        if: always()
        run: |
          if [ -n "$(git status --porcelain push/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add push/state.json
            git commit -m "Joran: Push-Zustand"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
      - name: Seemessung archivieren
        # Zusätzlich eine Datei pro Tag (archive/JJJJ-MM-TT.json im Branch «live») als Wahrheit für die Kalibrierung.
        # Läuft nach der Push-Prüfung; Fehler werden abgefangen und halten den Lauf nicht auf.
        if: always() && (github.event_name == 'schedule' || format('{0}', inputs.test) != 'true')
        continue-on-error: true
        timeout-minutes: 1
        run: node push/archive.cjs
        env:
          JORAN_LAKE: ${{ runner.temp }}/lake.json
          ARCHIVE_TREE: ${{ runner.temp }}/archive.tree
      - name: Messreihe Seestationen veröffentlichen
        # Ein einzelner Commit im Branch «live», jedes Mal ersetzt — keine Commit-Flut in main.
        # Der Commit enthält lake.json und den Ordner archive (neu nachgeführt oder unverändert übernommen).
        if: always() && (github.event_name == 'schedule' || format('{0}', inputs.test) != 'true')
        run: |
          f="$RUNNER_TEMP/lake.json"
          [ -s "$f" ] || exit 0
          base=$(git rev-parse -q --verify "origin/live^{commit}" 2>/dev/null || true)
          if [ -z "$base" ] && [ -n "$(git ls-remote origin refs/heads/live 2>/dev/null)" ]; then
            echo "::warning::Branch live nicht geholt — Messreihe und Archiv bleiben unverändert."; exit 0
          fi
          arch=""
          [ -n "$base" ] && arch=$(git rev-parse -q --verify "$base:archive" 2>/dev/null || true)
          t="$RUNNER_TEMP/archive.tree"
          if [ -s "$t" ] && git cat-file -e "$(cat "$t")^{tree}" 2>/dev/null; then arch=$(cat "$t"); fi
          blob=$(git hash-object -w "$f")
          tree=$( { [ -n "$arch" ] && printf "040000 tree %s\tarchive\n" "$arch"; printf "100644 blob %s\tlake.json\n" "$blob"; } | git mktree)
          commit=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit-tree "$tree" -m "Joran: Messreihe Seestationen")
          git push -q --force-with-lease="refs/heads/live:$base" origin "$commit:refs/heads/live"

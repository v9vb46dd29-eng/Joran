name: Joran Push

on:
  schedule:
    # alle 10 Minuten, 04–19 UTC (= 06–21 Uhr Sommerzeit). Ungerade Minuten, weil GitHub zur vollen Stunde oft verzögert.
    - cron: "7,17,27,37,47,57 4-19 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Nur Testnachricht senden"
        type: boolean
        default: true
      user:
        description: "Test nur an diesen Nutzer (leer = alle)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: joran-push
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wind prüfen
        run: node push/check.cjs
        env:
          NTFY_TOPICS: ${{ secrets.NTFY_TOPICS }}
          JORAN_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
          JORAN_USER: ${{ inputs.user }}
          JORAN_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Zustand sichern
        if: always()
        run: |
          if [ -n "$(git status --porcelain push/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add push/state.json
            git commit -m "Joran: Push-Zustand"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi

name: Joran Nutzer

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  save:
    if: startsWith(github.event.issue.title, 'Joran Push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Einstellungen prüfen und speichern
        run: node push/users.cjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          NTFY_TOPICS: ${{ secrets.NTFY_TOPICS }}
          JORAN_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Speichern im Repo
        run: |
          if [ -n "$(git status --porcelain users)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A users
            git commit -m "Joran: Einstellungen ${{ github.event.issue.user.login }}"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
      - name: Antwort im Issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --body-file /tmp/joran_result.md
          if [ "$(cat /tmp/joran_result.md.ok)" = "1" ]; then gh issue close "$NUM"; fi
